[package]
name = "peerlink"
version = "0.1.0"
edition = "2024"

[features]
default = []
wayland = ["dep:ashpd", "dep:pipewire", "dep:libspa", "dep:tokio"]

[dependencies]
ashpd = { version = "0.13", features = ["screencast"], optional = true }
clap = { version = "4.6.1", features = ["derive"] }
eframe = "0.35.0"
egui = "0.35.0"
ffmpeg-next = "8.1.0"
libc = "0.2.186"
libspa = { version = "0.9", optional = true }
openh264 = "0.9.7"
pipewire = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
xcap = "0.9.6"
